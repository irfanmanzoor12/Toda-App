# TASK-059: Dapr Cron Binding for Reminder Service
# Triggers every minute to check for due reminders
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-reminder
  namespace: default
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "*/1 * * * *"  # Every minute
    - name: direction
      value: "input"
scopes:
  - reminder-service
