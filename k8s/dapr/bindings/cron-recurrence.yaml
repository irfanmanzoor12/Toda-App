# TASK-058: Dapr Cron Binding for Recurrence Service
# Triggers every minute to check for due recurrence patterns
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-recurrence
  namespace: default
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: "*/1 * * * *"  # Every minute
    - name: direction
      value: "input"
scopes:
  - recurrence-service
