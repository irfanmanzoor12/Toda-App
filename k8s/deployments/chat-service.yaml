# TASK-064: Kubernetes Deployment for Chat Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: default
  labels:
    app: chat-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "chat-service"
        dapr.io/app-port: "3002"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: chat-service
          image: ghcr.io/todoapp/chat-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OPENAI_API_KEY
            - name: MCP_SERVER_URL
              value: "http://mcp-http-server:3003"
            - name: DAPR_HTTP_PORT
              value: "3500"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: default
spec:
  selector:
    app: chat-service
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
