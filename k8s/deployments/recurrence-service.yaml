# TASK-061: Kubernetes Deployment for Recurrence Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recurrence-service
  namespace: default
  labels:
    app: recurrence-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recurrence-service
  template:
    metadata:
      labels:
        app: recurrence-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "recurrence-service"
        dapr.io/app-port: "8002"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
        - name: recurrence-service
          image: ghcr.io/todoapp/recurrence-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: PUBSUB_NAME
              value: "kafka-pubsub"
            - name: TASK_SERVICE_APP_ID
              value: "task-service"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recurrence-service
  namespace: default
spec:
  selector:
    app: recurrence-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
