{{/*
TASK-075: Reminder Service deployment template
*/}}
{{- if .Values.reminderService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todoapp.fullname" . }}-reminder-service
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: reminder-service
spec:
  replicas: {{ .Values.reminderService.replicaCount }}
  selector:
    matchLabels:
      {{- include "todoapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: reminder-service
  template:
    metadata:
      labels:
        {{- include "todoapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: reminder-service
      annotations:
        {{- include "todoapp.daprAnnotations" .Values.reminderService | nindent 8 }}
    spec:
      containers:
        - name: reminder-service
          image: {{ include "todoapp.image" (dict "global" .Values.global "service" .Values.reminderService) }}
          imagePullPolicy: {{ .Values.reminderService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.reminderService.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "todoapp.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: PUBSUB_NAME
              value: {{ .Values.dapr.pubsub.name | quote }}
          resources:
            {{- toYaml .Values.reminderService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.reminderService.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.reminderService.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todoapp.fullname" . }}-reminder-service
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "todoapp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: reminder-service
  ports:
    - port: {{ .Values.reminderService.port }}
      targetPort: {{ .Values.reminderService.port }}
  type: ClusterIP
{{- end }}
