{{/*
TASK-075: Task Service deployment template
*/}}
{{- if .Values.taskService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todoapp.fullname" . }}-task-service
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: task-service
spec:
  replicas: {{ .Values.taskService.replicaCount }}
  selector:
    matchLabels:
      {{- include "todoapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: task-service
  template:
    metadata:
      labels:
        {{- include "todoapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: task-service
      annotations:
        {{- include "todoapp.daprAnnotations" .Values.taskService | nindent 8 }}
    spec:
      containers:
        - name: task-service
          image: {{ include "todoapp.image" (dict "global" .Values.global "service" .Values.taskService) }}
          imagePullPolicy: {{ .Values.taskService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.taskService.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "todoapp.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: PUBSUB_NAME
              value: {{ .Values.dapr.pubsub.name | quote }}
            - name: TOPIC_NAME
              value: "task-events"
          resources:
            {{- toYaml .Values.taskService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.taskService.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.taskService.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todoapp.fullname" . }}-task-service
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "todoapp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: task-service
  ports:
    - port: {{ .Values.taskService.port }}
      targetPort: {{ .Values.taskService.port }}
  type: ClusterIP
{{- if .Values.taskService.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "todoapp.fullname" . }}-task-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "todoapp.fullname" . }}-task-service
  minReplicas: {{ .Values.taskService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.taskService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.taskService.autoscaling.targetCPUUtilization }}
{{- end }}
{{- end }}
