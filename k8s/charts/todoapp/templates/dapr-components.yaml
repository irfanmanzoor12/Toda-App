{{/*
TASK-075: Dapr components template
*/}}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.dapr.pubsub.name }}
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: {{ .Values.dapr.pubsub.brokers | quote }}
    - name: consumerGroup
      value: "todoapp-consumer-group"
    - name: authType
      value: "none"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.dapr.stateStore.name }}
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: {{ .Values.dapr.stateStore.redisHost | quote }}
    - name: redisPassword
      value: ""
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-recurrence
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: {{ .Values.dapr.cron.recurrenceSchedule | quote }}
    - name: direction
      value: "input"
scopes:
  - {{ .Values.recurrenceService.dapr.appId }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-reminder
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    - name: schedule
      value: {{ .Values.dapr.cron.reminderSchedule | quote }}
    - name: direction
      value: "input"
scopes:
  - {{ .Values.reminderService.dapr.appId }}
