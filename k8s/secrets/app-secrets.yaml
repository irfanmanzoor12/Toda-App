# TASK-063: Kubernetes Secret Template for App Credentials
# NOTE: Replace placeholders with base64-encoded values before applying
# Generate: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
data:
  DATABASE_URL: # base64 encoded: postgresql://user:pass@host:5432/db
  OPENAI_API_KEY: # base64 encoded OpenAI API key
  BETTER_AUTH_SECRET: # base64 encoded auth secret
---
# For development, create secrets from .env file:
# kubectl create secret generic app-secrets --from-env-file=.env.production
