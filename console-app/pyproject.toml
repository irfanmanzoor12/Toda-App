[project]
name = "todo-console-app"
version = "1.0.0"
description = "Hackathon II Phase I: In-Memory Python Console Todo Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
todo = "main:main"
