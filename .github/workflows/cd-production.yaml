# TASK-074: CD Pipeline - Production Deployment
name: CD Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g., v1.2.3)"
        required: true
        type: string
      skip_approval:
        description: "Skip manual approval (emergency only)"
        required: false
        type: boolean
        default: false

env:
  CLUSTER_NAME: todoapp-production
  NAMESPACE: production

jobs:
  approval:
    name: Await Approval
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_approval }}
    environment: production

    steps:
      - name: Approval gate
        run: echo "Deployment approved"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approval]
    if: always() && (needs.approval.result == 'success' || inputs.skip_approval)

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Deploy with canary rollout
        run: |
          # Deploy canary (10% traffic)
          kubectl apply -f k8s/deployments/ -n ${{ env.NAMESPACE }}
          kubectl set image deployment/task-service task-service=ghcr.io/${{ github.repository }}/task-service:${{ inputs.version }} -n ${{ env.NAMESPACE }}

      - name: Monitor for 15 minutes
        run: |
          echo "Monitoring deployment for 15 minutes..."
          END_TIME=$((SECONDS + 900))

          while [ $SECONDS -lt $END_TIME ]; do
            # Check error rate (placeholder - integrate with actual monitoring)
            ERROR_RATE=$(kubectl top pods -n ${{ env.NAMESPACE }} --no-headers | wc -l || echo "0")

            if [ "$ERROR_RATE" -gt 5 ]; then
              echo "Error rate too high, initiating rollback"
              kubectl rollout undo deployment/task-service -n ${{ env.NAMESPACE }}
              exit 1
            fi

            sleep 30
          done

          echo "Monitoring complete, deployment successful"

      - name: Complete rollout
        run: |
          # Scale to full deployment
          kubectl scale deployment/task-service --replicas=5 -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/task-service -n ${{ env.NAMESPACE }} --timeout=600s

      - name: Notify success
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Production deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful*\nVersion: ${{ inputs.version }}\nRepo: ${{ github.repository }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Production deployment FAILED - Auto-rollback initiated",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PRODUCTION DEPLOYMENT FAILED*\nVersion: ${{ inputs.version }}\nAction: Auto-rollback initiated"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
